        <div class="flex-1 lg:ml-64">
            <header class="sticky top-0 z-20 bg-[#f8f3e9] border-b border-[#d9d1c6] px-6 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <button id="menu-toggle" class="lg:hidden p-2 hover:bg-[#eae0d1] rounded-lg transition-colors"><i data-lucide="menu" class="w-6 h-6"></i></button>
                        <h1 class="font-serif text-2xl text-[#281e19]">Paramètres</h1>
                    </div>
                    <div class="flex items-center gap-4">
                        <button class="relative p-2 hover:bg-[#eae0d1] rounded-lg transition-colors"><i data-lucide="bell" class="w-5 h-5 text-[#705f57]"></i></button>
                        <div class="flex items-center gap-3 pl-4 border-l border-[#d9d1c6]"><div class="w-10 h-10 bg-[#133a28] rounded-full flex items-center justify-center text-white font-semibold">A</div></div>
                    </div>
                </div>
            </header>
            <main class="p-6">
                <div class="max-w-4xl space-y-6">
                    <div class="bg-white rounded-xl p-8 border border-[#d9d1c6]">
                        <h2 class="font-serif text-xl text-[#281e19] mb-6">Profil</h2>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label for="name" class="block text-sm font-medium text-[#281e19] mb-2">Nom</label>
                                <input type="text" id="name" name="name" value="Admin" class="w-full px-4 py-3 border border-[#d9d1c6] rounded-lg focus:outline-none focus:border-[#133a28] focus:ring-1 focus:ring-[#133a28] transition-all" />
                            </div>
                            <div>
                                <label for="email" class="block text-sm font-medium text-[#281e19] mb-2">Email</label>
                                <input type="email" id="email" name="email" value="admin@mikanda.com" class="w-full px-4 py-3 border border-[#d9d1c6] rounded-lg focus:outline-none focus:border-[#133a28] focus:ring-1 focus:ring-[#133a28] transition-all" />
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl p-8 border border-[#d9d1c6]">
                        <h2 class="font-serif text-xl text-[#281e19] mb-6">Préférences</h2>
                        <div class="space-y-4">
                            <div class="flex items-center justify-between"><label class="text-sm font-medium text-[#281e19]">Notifications par email</label><input type="checkbox" checked class="w-5 h-5 accent-[#133a28]" /></div>
                            <div class="flex items-center justify-between"><label class="text-sm font-medium text-[#281e19]">Notifications système</label><input type="checkbox" checked class="w-5 h-5 accent-[#133a28]" /></div>
                        </div>
                    </div>
                    <div class="flex items-center justify-end gap-4">
                        <button class="px-6 py-3 bg-[#133a28] text-white rounded-lg text-sm font-medium hover:bg-[#245743] transition-colors">Enregistrer</button>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <div id="notification-container" class="fixed top-4 right-4 z-50 space-y-2"></div>
    <script>
        const session = localStorage.getItem('mikanda-admin-session')
        if (!session) window.location.href = 'login.html'
        function showNotification(message, type = 'success') {
            const container = document.getElementById('notification-container')
            const notification = document.createElement('div')
            const colors = { success: 'bg-green-600', error: 'bg-red-600', warning: 'bg-yellow-600', info: 'bg-blue-600' }
            notification.className = `${colors[type]} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 transform translate-x-full transition-transform duration-300`
            notification.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5"></i><span class="text-sm">${message}</span>`
            container.appendChild(notification)
            lucide.createIcons()
            requestAnimationFrame(() => notification.classList.remove('translate-x-full'))
            setTimeout(() => { notification.classList.add('translate-x-full'); setTimeout(() => notification.remove(), 300) }, 3000)
        }
        const menuToggle = document.getElementById('menu-toggle')
        const sidebar = document.getElementById('sidebar')
        menuToggle.addEventListener('click', () => sidebar.classList.toggle('-translate-x-full'))
        document.addEventListener('click', (e) => { if (!sidebar.contains(e.target) && !menuToggle.contains(e.target) && !sidebar.classList.contains('-translate-x-full')) sidebar.classList.add('-translate-x-full') })
        lucide.createIcons()
    </script>

</html>
